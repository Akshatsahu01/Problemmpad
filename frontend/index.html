<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1017" />
    <script>
      try {
        const savedTheme = localStorage.getItem('problempad-theme');
        const theme = ['light', 'dark', 'pokkie'].includes(savedTheme) ? savedTheme : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0c1118' : theme === 'pokkie' ? '#fff0f5' : '#f5f7fb';
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ProblemPad — Your problem library</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
